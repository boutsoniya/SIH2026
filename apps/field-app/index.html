<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1220" />
    <title>NARCOSCOPE — Field Companion</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #070b12; }
      #root { min-height: 100vh; }
      .boot-screen { min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; color: #9aaabd; background: #070b12; font: 14px system-ui, sans-serif; }
      .boot-card { width: min(720px, 100%); border: 1px solid #26364b; border-radius: 18px; padding: 28px; background: #0c131f; }
      .boot-card strong { display: block; color: #e8eef8; font-size: 24px; margin-bottom: 10px; }
      .boot-card span { color: #8190a5; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen">
        <div class="boot-card">
          <strong>Loading NARCOSCOPE…</strong>
          <span>Starting the field companion and connecting the vision service.</span>
        </div>
      </div>
    </div>
    <noscript>
      <div class="boot-screen">
        <div class="boot-card">
          <strong>JavaScript is required</strong>
          <span>Please enable JavaScript to run the NARCOSCOPE field application.</span>
        </div>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
